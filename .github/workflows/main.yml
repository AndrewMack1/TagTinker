name: Build TagTinker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: .

      - name: Upload fap
        uses: actions/upload-artifact@v4
        with:
          name: TagTinker-fap
          path: dist/*.fap
